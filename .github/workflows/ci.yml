name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7
      - run: deno test --allow-read extensions/models/
  contracts:
    uses: puddle-works/puddle-tooling/.github/workflows/contracts-check.yml@v0.2.1
    with:
      tooling-ref: v0.2.1
  guardrails:
    uses: puddle-works/puddle-tooling/.github/workflows/guardrails-check.yml@v0.2.1
    with:
      tooling-ref: v0.2.1
  publish:
    uses: puddle-works/puddle-tooling/.github/workflows/publish.yml@v0.2.1
    with:
      visibility: public # must equal visibility: in manifest.yaml
      dry-run: true # false pushes
      tests: deno test --allow-read extensions/models/
      tooling-ref: v0.2.1
    secrets:
      SWAMP_API_KEY: ${{ secrets.SWAMP_API_KEY }}
      SWAMP_SIGNIN_TOKEN: ${{ secrets.SWAMP_SIGNIN_TOKEN }}
